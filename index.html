<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IELTS Vocabulary Recognizer</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#20242a;font-family:Arial,"Microsoft YaHei",sans-serif}
.wrap{max-width:820px;margin:auto;padding:18px 15px 42px}
button{border:1px solid #ddd;background:#fff;color:#222;border-radius:12px;padding:10px 14px;font-size:14px}
button:active{transform:translateY(1px)}
.primary{background:#222;color:#fff;border-color:#222}
.header{margin:5px 2px 18px}
h1{font-size:23px;margin:0}.sub{font-size:12px;color:#888;margin-top:5px}
.card{background:#fff;border:1px solid #e5e7ea;border-radius:20px;padding:20px;box-shadow:0 6px 24px #00000008}
.home-main{padding:18px}.start{width:100%;padding:17px;text-align:left;font-size:16px}
.start small{display:block;color:#999;margin-top:5px}
.libs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.lib{padding:16px;text-align:left}.lib b{display:block;font-size:21px}.lib small{color:#888}
.status{text-align:center;color:#888;font-size:12px;margin-top:14px}
.quiz-head{display:flex;justify-content:space-between;color:#777;font-size:13px}
.progress{height:7px;background:#eee;border-radius:9px;overflow:hidden;margin:9px 0 15px}
.bar{height:100%;background:#222;width:0}
.wordbox{text-align:center;min-height:280px;padding-top:20px}
.timer{font-size:13px;color:#777}.timer b{font-size:20px;color:#222}
.word{font-size:43px;margin:45px 0 7px;letter-spacing:.2px}
.ipa{color:#777;min-height:18px}
.speak{border-radius:50%;width:44px;height:44px;padding:0;margin-top:10px}
.answers{display:flex;gap:12px}.answers button{flex:1;padding:14px;font-size:16px}
.pausebar{display:flex;justify-content:center;gap:9px;margin-top:12px;flex-wrap:wrap}
.pausebar button{font-size:13px}.hint{text-align:center;color:#aaa;font-size:11px;margin-top:10px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;padding:10px;z-index:10}
.modal.show{display:flex}
.sheet{background:#fff;width:min(780px,100%);max-height:90vh;overflow:auto;border-radius:22px 22px 12px 12px;padding:20px}
.sheet-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet h2{margin:0;font-size:28px}.muted{font-size:12px;color:#888;margin-top:5px}
.toolbar{display:flex;gap:7px}.list{margin-top:14px;border-top:1px solid #eee}
.item{padding:13px 3px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.item b{font-size:16px}.item small{display:block;color:#888;margin-top:4px}
.empty{text-align:center;color:#999;padding:35px}
.sec{margin-top:19px}.sec h3{font-size:14px;margin:0 0 8px}.sec p{line-height:1.6;margin:0}
.pill{display:inline-block;background:#f2f3f5;border-radius:8px;padding:5px 8px;margin:3px 4px 3px 0;font-size:12px}
.loading{color:#888;font-size:13px}
@media(max-width:600px){.libs{grid-template-columns:1fr}.word{font-size:36px}}
@media print{body{background:white}.wrap,.modal{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="header"><h1>IELTS Vocabulary Recognizer</h1><div class="sub">5000 words · 5-second recognition</div></div>

<section id="home" class="card home-main">
<button class="start primary" onclick="startOrResume()">▶ <span id="startTitle">开始认词</span>
<small id="startSub">每个词 5 秒 · 自动保存进度</small></button>
<div class="libs">
<button class="lib" onclick="openLibrary('known')">✓ <b id="knownCount">0</b><small>认识词库 · 已判断</small></button>
<button class="lib" onclick="openLibrary('unknown')">✕ <b id="unknownCount">0</b><small>不认识词库 · 已判断</small></button>
</div>
<div class="status" id="status"></div>
</section>

<section id="quiz" class="card" style="display:none">
<div class="quiz-head"><span id="counter"></span><span id="accuracy"></span></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div class="wordbox">
<div class="timer">判断剩余 <b id="seconds">5</b>s</div>
<div id="word" class="word"></div><div id="ipa" class="ipa"></div>
<button class="speak" onclick="speakCurrent()">🔊</button>
</div>
<div class="answers"><button onclick="answer(false)">不认识</button><button class="primary" onclick="answer(true)">认识</button></div>
<div class="pausebar">
<button id="tempPause" onclick="togglePause()">⏸ 暂时暂停</button>
<button onclick="longPause()">⏸ 长期暂停并退出</button>
</div>
<div class="hint">判断后立即写入对应词库；无需手动保存。</div>
</section>
</div>

<div id="library" class="modal" onclick="outsideClose(event,'library')">
<div class="sheet">
<div class="sheet-head">
<div><h2 id="libraryTitle"></h2><div id="librarySub" class="muted"></div></div>
<div class="toolbar"><button onclick="exportPDF()">导出 PDF</button><button onclick="closeLibrary()">关闭</button></div>
</div>
<div id="libraryList" class="list"></div>
</div></div>

<div id="wordCard" class="modal" onclick="outsideClose(event,'wordCard')">
<div class="sheet">
<div class="sheet-head">
<div><h2 id="cardWord"></h2><div id="cardIPA" class="muted"></div></div>
<div class="toolbar"><button onclick="exportPDF()">导出 PDF</button><button onclick="closeCard()">关闭</button></div>
</div>
<div class="sec"><button onclick="speakCard()">🔊 播放读音</button></div>
<div class="sec"><h3>核心释义</h3><p id="meaning" class="loading">正在查询……</p></div>
<div class="sec"><h3>常用用法 / 搭配</h3><div id="usage"></div></div>
<div class="sec"><h3>俚语 / 非正式用法</h3><p id="slang"></p></div>
<div class="sec"><h3>例句</h3><p id="example"></p></div>
</div></div>

<script>
const KEY="ielts_recognizer_v4";
const KNOWN="ielts_known_library_v4", UNKNOWN="ielts_unknown_library_v4";
const BUILTIN_WORDS=['approach','feature','function','requirement','issue','handle','coordinate','collaborate','analysis','analyst','market','market demand','target market','market size','market growth','growth rate','market trend','consumer behavior','consumer preferences','purchasing power','price sensitivity','competitive landscape','competitor','competitor analysis','market share','market entry','market potential','market research','data collection','data source','primary data','secondary data','key findings','business opportunity','market opportunity','potential customer','customer needs','customer retention','international trade','export','import','supplier','buyer','quotation','pricing','shipment','logistics','customs','trade terms','trade agreement','overseas market','foreign market','cross-border','sales','revenue','profit','cost','budget','forecast','performance','KPI','campaign','marketing strategy','product positioning','customer feedback','user feedback','user experience','product development','product launch','product feature','data analysis','data cleaning','database','dashboard','report','presentation','proposal','deadline','meeting','agenda','minutes','follow-up','update','progress','task','priority','deliverable','stakeholder','client','partner','vendor','contract','negotiation','strategy','objective','goal','outcome','result','impact','risk','challenge','solution','option','method','process','procedure','policy','guideline','project','operation','operations','implementation','evaluation','assessment','evidence','factor','indicate','identify','evaluate','assess','compare','improve','increase','decrease','maintain','support','provide','develop','conduct','collect','review','summarize','present','recommend','suggest','clarify','confirm','revise','submit','approve','request','respond','follow up','look into','take a look','break down','figure out','abandon','ability','able','abroad','absence','absolute','absorb','abstract','academic','access','accident','accompany','accomplish','according','account
','accurate','achieve','acquire','adapt','adequate','adjust','administration','adopt','adult','advance','advantage','advertise','affect','afford','agency','agenda','agriculture','aid','aim','alter','alternative','amount','analyze','annual','apparent','appeal','apply','appreciate','approach','appropriate','area','argue','arise','arrange','aspect','assess','assign','assist','assume','attach','attempt','attend','attitude','audience','authority','available','average','avoid','aware','balance','benefit','brief','capable','capacity','career','category','cause','challenge','chapter','circumstance','civil','claim','clarify','classic','climate','combine','comment','communicate','community','compare','compete','complex','concept','concern','conduct','confirm','conflict','connect','consequence','consider','consistent','consumer','contact','contain','context','contract','contribute','convenient','convert','cooperate','core','corporate','create','credit','culture','current','decline','define','demand','demonstrate','deny','derive','design','despite','determine','develop','device','differ','digital','direct','distribute','economy','effective','efficient','element','emerge','emphasis','employ','enable','encounter','environment','equivalent','establish','estimate','evaluate','evidence','exclude','expand','expect','experience','expert','explain','explore','export','expose','factor','feature','finance','focus','foreign','framework','function','generate','global','goal','grant','guarantee','identify','ignore','illustrate','impact','implement','imply','improve','include','income','increase','indicate','individual','influence','inform','initial','innovate','instance','institution','integrate','intend','interact','internal','interpret','involve','issue','maintain','major','manage','manufacture','margin','measure','method','migrate','minimum','modify','monitor','motivate','occur','obtain','obvious','participate','perceive','period','perspective','policy','potential','predict','prefer','prepare','previous','primary','principle','process
','produce','professional','promote','propose','provide','purchase','pursue','quality','range','react','recognize','recommend','reduce','region','regulate','relevant','require','research','respond','retain','reveal','revenue','role','secure','select','significant','similar','source','specific','strategy','structure','submit','sufficient','survey','target','technique','technology','temporary','theory','therefore','traditional','transfer','transform','transport','trend','undertake','unique','update','urban','valid','vary','version','volume','whereas','widespread','workforce'];
let state=load(KEY)||{words:[],index:0,results:[]};
let timer=null,seconds=5,paused=false,current=null,currentLibrary="known",cardData=null;

function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uniqueWords(a){let m=new Map();a.forEach(x=>{x=String(x).trim();if(x)m.set(x.toLowerCase(),x)});return [...m.values()]}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lib(type){return load(type==="known"?KNOWN:UNKNOWN)||[]}
function syncLibraries(){
 let k=[],u=[];
 state.words.forEach((w,n)=>{if(state.results[n]===true)k.push(w);if(state.results[n]===false)u.push(w)});
 save(KNOWN,k);save(UNKNOWN,u);updateHome()
}
function updateHome(){
 let k=lib("known").length,u=lib("unknown").length;
 document.getElementById("knownCount").textContent=k;
 document.getElementById("unknownCount").textContent=u;
 let done=state.results.filter(x=>typeof x==="boolean").length;
 document.getElementById("startTitle").textContent=done?"继续认词":"开始认词";
 document.getElementById("startSub").textContent=done?`已判断 ${done} 个 · 从第 ${state.index+1} 个继续`:"每个词 5 秒 · 自动保存进度";
 document.getElementById("status").textContent=`认识 ${k} · 不认识 ${u} · 共 ${state.words.length||5000} 词`;
}
async function makeCorpus(){
 if(state.words.length)return;
 let arr=uniqueWords(BUILTIN_WORDS);
 // Try the public IELTS list; failure is harmless because the app remains usable offline.
 try{
  let r=await fetch("https://raw.githubusercontent.com/LynnShaw/vocabulary_for_ielts/main/word_list.csv");
  if(r.ok){
   let t=await r.text();
   t.split(/\r?\n/).slice(1).forEach(line=>{
    let w=(line.split(",")[0]||"").replace(/^"|"$/g,"").trim();
    if(/^[A-Za-z][A-Za-z -]*$/.test(w))arr.push(w);
   });
  }
 }catch(e){}
 arr=uniqueWords(arr);
 while(arr.length<5000){
   // Repeat only as a last-resort filler if the network list is unavailable.
   arr=uniqueWords(arr.concat(arr.slice(0,Math.min(arr.length,5000-arr.length))));
 }
 state.words=shuffle(arr).slice(0,5000);state.index=0;state.results=[];
 save(KEY,state);syncLibraries();
}
async function startOrResume(){
 await makeCorpus();
 document.getElementById("home").style.display="none";
 document.getElementById("quiz").style.display="block";
 render();
}
function render(){
 if(state.index>=state.words.length){finish();return}
 current=state.words[state.index];
 document.getElementById("counter").textContent=`${state.index+1} / ${state.words.length}`;
 let done=state.results.filter(x=>typeof x==="boolean").length;
 let acc=done?Math.round(state.results.slice(0,state.index).filter(Boolean).length/done*100):0;
 document.getElementById("accuracy").textContent=`认识率 ${acc}%`;
 document.getElementById("bar").style.width=(state.index/state.words.length*100)+"%";
 document.getElementById("word").textContent=current;
 document.getElementById("ipa").textContent="";
 seconds=5;paused=false;document.getElementById("seconds").textContent=5;
 document.getElementById("tempPause").textContent="⏸ 暂时暂停";
 clearInterval(timer);
 setTimeout(()=>speakCurrent(),120);
 timer=setInterval(()=>{if(paused)return;seconds--;document.getElementById("seconds").textContent=seconds;if(seconds<=0)answer(false)},1000);
}
function speakText(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.82;speechSynthesis.speak(u)}catch(e){}}
function speakCurrent(){if(current)speakText(current)}
function answer(known){
 if(paused)return;
 clearInterval(timer);state.results[state.index]=known;state.index++;
 save(KEY,state);syncLibraries();render();
}
function togglePause(){
 paused=!paused;
 document.getElementById("tempPause").textContent=paused?"▶ 继续":"⏸ 暂时暂停";
 if(!paused)speakCurrent();
}
function longPause(){clearInterval(timer);save(KEY,state);syncLibraries();showHome()}
function showHome(){document.getElementById("quiz").style.display="none";document.getElementById("home").style.display="block";updateHome()}
function finish(){save(KEY,state);syncLibraries();showHome();document.getElementById("status").textContent="本轮 5000 词已完成；两个词库已保存。"}
function openLibrary(type){
 currentLibrary=type;let a=lib(type);
 document.getElementById("libraryTitle").textContent=type==="known"?"认识词库":"不认识词库";
 document.getElementById("librarySub").textContent=`${a.length} 个 · 随认词进度实时更新`;
 document.getElementById("libraryList").innerHTML=a.length?a.map((w,n)=>`<div class="item" onclick="openCard(${n})"><div><b>${esc(w)}</b><small>点击查看单词卡</small></div><span>›</span></div>`).join(""):`<div class="empty">还没有判断过的词。</div>`;
 document.getElementById("library").classList.add("show")
}
function closeLibrary(){document.getElementById("library").classList.remove("show")}
function openCard(n){
 let a=lib(currentLibrary);current=a[n];if(!current)return;
 document.getElementById("cardWord").textContent=current;
 document.getElementById("cardIPA").textContent="";
 document.getElementById("meaning").textContent="正在查询词典……";
 document.getElementById("usage").innerHTML="";
 document.getElementById("slang").textContent="查询中……";
 document.getElementById("example").textContent="查询中……";
 document.getElementById("wordCard").classList.add("show");
 loadDictionary(current);
}
async function loadDictionary(w){
 try{
  let r=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w));
  if(!r.ok)throw Error();
  let d=(await r.json())[0], phon=d.phonetic||(d.phonetics||[]).find(x=>x.text)?.text||"";
  document.getElementById("cardIPA").textContent=phon;
  let defs=[],examples=[],labels=[];
  (d.meanings||[]).forEach(m=>(m.definitions||[]).forEach(x=>{
    if(x.definition)defs.push((m.partOfSpeech?m.partOfSpeech+": ":"")+x.definition);
    if(x.example)examples.push(x.example);
    if(m.partOfSpeech==="slang"||/informal|slang/i.test(x.definition||""))labels.push(x.definition);
  }));
  document.getElementById("meaning").textContent=defs.slice(0,3).join("；")||"暂无释义";
  document.getElementById("example").textContent=examples[0]||"暂无例句";
  document.getElementById("slang").textContent=labels[0]||"未找到常见俚语 / 非正式用法";
  let syn=[...new Set((d.meanings||[]).flatMap(m=>(m.definitions||[]).flatMap(x=>x.synonyms||[])))].slice(0,10);
  document.getElementById("usage").innerHTML=syn.length?syn.map(x=>`<span class="pill">${esc(x)}</span>`).join(""):"暂无搭配数据（可结合语境查看）";
 }catch(e){
  document.getElementById("cardIPA").textContent="";
  document.getElementById("meaning").textContent="当前网络词典不可用。";
  document.getElementById("usage").innerHTML='<span class="muted">重新打开单词卡可再次查询。</span>';
  document.getElementById("slang").textContent="暂无数据";
  document.getElementById("example").textContent="暂无数据";
 }
}
function closeCard(){document.getElementById("wordCard").classList.remove("show")}
function speakCard(){speakText(current)}
function outsideClose(e,id){if(e.target.id===id)document.getElementById(id).classList.remove("show")}
function exportPDF(){
 let a=lib(currentLibrary),title=currentLibrary==="known"?"认识词库":"不认识词库";
 if(!a.length){alert("这个词库目前为空。");return}
 let w=window.open("","_blank");if(!w){alert("请允许浏览器打开新窗口。");return}
 w.document.write(`<html><head><meta charset="utf-8"><title>${title}</title><style>body{font-family:Arial,"Microsoft YaHei";padding:24px}h1{font-size:22px}.x{padding:8px 0;border-bottom:1px solid #eee}.n{font-weight:bold}.s{color:#888;font-size:12px}</style></head><body><h1>IELTS Vocabulary · ${title}</h1><div class=s>共 ${a.length} 个</div>${a.map((x,n)=>`<div class=x>${n+1}. <span class=n>${esc(x)}</span></div>`).join("")}</body></html>`);
 w.document.close();setTimeout(()=>w.print(),300)
}
updateHome();
</script>
</body></html>
